{% if box.owner_user_id == current_user.id %}
    <span class="badge badge--info">À moi</span>
{% endif %}

{% if box.current_holder_user_id == current_user.id %}
    <span class="badge badge--positive">Chez moi</span>
{% endif %}

{% if box.interest_flags %}
    <span class="badge badge--warning">{{ box.interest_flags|length }} intéressé(s)</span>
{% endif %}

{% if box.interest_flag_for_user(current_user) %}
    <span class="badge badge--warning">I would like</span>
{% endif %}
