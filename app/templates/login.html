{% extends "base.html" %}
{% block title %}Connexion — RacinePoir{% endblock %}
{% block content %}
<h2>Connexion</h2>

{% if next_page %}
<p>Connecte-toi pour continuer le scan demandé.</p>
{% endif %}

{% if error %}<p class="notice notice--error" role="alert">{{ error }}</p>{% endif %}

<form method="post">
<input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
<input type="hidden" name="next" value="{{ next_page or '' }}">
<p><label>Username</label><br><input type="text" name="username"></p>
<p><label>Mot de passe</label><br><input type="password" name="password"></p>
<button type="submit">Se connecter</button>
</form>

<p><a href="/register">S'inscrire avec un code d'invitation</a></p>

{% endblock %}
