{% extends "base.html" %}
{% block title %}Connexion — RacinePoir{% endblock %}
{% block content %}
<h2>Connexion</h2>

{% if next_page %}
<p>Connecte-toi pour continuer le scan demandé.</p>
{% endif %}

{% if error %}<p class="notice notice--error" role="alert">{{ error }}</p>{% endif %}

<form method="post">
<input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
<input type="hidden" name="next" value="{{ next_page or '' }}">
<p><label for="login-username">Username</label><br><input id="login-username" type="text" name="username" autocomplete="username" required></p>
<p><label for="login-password">Mot de passe</label><br><input id="login-password" type="password" name="password" autocomplete="current-password" required></p>
<button type="submit">Se connecter</button>
</form>

<p><a href="/register">S'inscrire avec un code d'invitation</a></p>

{% endblock %}
