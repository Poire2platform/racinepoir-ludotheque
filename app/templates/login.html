{% extends "base.html" %}

{% block title %}Connexion — RacinePoir{% endblock %}

{% block content %}
    <h2>Connexion</h2>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="post">
        <p>
            <label>Username</label><br>
            <input type="text" name="username">
        </p>

        <p>
            <label>Mot de passe</label><br>
            <input type="password" name="password">
        </p>

        <button type="submit">Se connecter</button>
    </form>

    <hr>

    <p>Comptes dev possibles :</p>
    <ul>
        <li><code>max / max123</code></li>
        <li><code>anouk / anouk123</code></li>
        <li><code>frere / frere123</code></li>
        <li><code>admin / admin123</code></li>
    </ul>
{% endblock %}
