<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 650" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Architecture de sécurité publique de RacinePoir&amp;</title>
  <desc id="diagram-desc">Le navigateur rejoint Cloudflare en HTTPS. Un tunnel sortant transmet le trafic au service Web protégé. Une politique réseau limite ensuite l'accès au service de données privé.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#34212c" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9f4a25"/>
    </marker>
    <pattern id="stucco" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r="1" fill="#f5dcbe" opacity="0.22"/>
      <circle cx="13" cy="12" r="1.2" fill="#43202a" opacity="0.14"/>
      <circle cx="8" cy="17" r="0.8" fill="#d6aa91" opacity="0.18"/>
    </pattern>
    <style>
      .title { font: 700 32px Georgia, serif; fill: #f7ead8; }
      .subtitle { font: 500 16px system-ui, sans-serif; fill: #ead8c5; }
      .zone-title { font: 800 14px system-ui, sans-serif; letter-spacing: 1.2px; fill: #642d19; }
      .box-title { font: 700 21px Georgia, serif; fill: #34212c; }
      .box-copy { font: 500 14px system-ui, sans-serif; fill: #5f4b53; }
      .pill { font: 800 12px system-ui, sans-serif; fill: #34212c; }
      .flow { fill: none; stroke: #9f4a25; stroke-width: 4; marker-end: url(#arrow); }
      .flow-label { font: 700 13px system-ui, sans-serif; fill: #642d19; paint-order: stroke; stroke: #f0e1cb; stroke-width: 4px; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1120" height="650" rx="28" fill="#69454b"/>
  <rect width="1120" height="650" rx="28" fill="url(#stucco)"/>
  <text x="56" y="62" class="title">Comment une requête atteint RacinePoir&amp;</text>
  <text x="56" y="91" class="subtitle">Vue publique simplifiée — les adresses, ports de gestion et identifiants internes sont volontairement omis.</text>

  <rect x="38" y="130" width="214" height="390" rx="22" fill="#f0e1cb" opacity="0.96" stroke="#c48a32" stroke-width="2"/>
  <text x="58" y="160" class="zone-title">ZONE PUBLIQUE</text>

  <g filter="url(#shadow)">
    <rect x="65" y="205" width="160" height="112" rx="18" fill="#c6d2ad" stroke="#58684b" stroke-width="2"/>
    <circle cx="145" cy="239" r="16" fill="#58684b"/>
    <path d="M127 278 Q145 257 163 278" fill="none" stroke="#58684b" stroke-width="7" stroke-linecap="round"/>
    <text x="145" y="303" text-anchor="middle" class="box-title">Visiteur</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="65" y="365" width="160" height="112" rx="18" fill="#e6c486" stroke="#76501e" stroke-width="2"/>
    <path d="M115 410 Q145 375 175 410 Q192 411 192 430 H98 Q98 412 115 410Z" fill="#9f4a25" opacity="0.9"/>
    <text x="145" y="456" text-anchor="middle" class="box-title">Cloudflare</text>
  </g>

  <path d="M145 317 V365" class="flow"/>
  <text x="158" y="346" class="flow-label">HTTPS</text>

  <rect x="292" y="130" width="510" height="390" rx="22" fill="#ead8c5" opacity="0.97" stroke="#7f5d72" stroke-width="2"/>
  <text x="314" y="160" class="zone-title">ZONE WEB PROTÉGÉE</text>

  <g filter="url(#shadow)">
    <rect x="325" y="202" width="206" height="116" rx="18" fill="#dfccd5" stroke="#7f5d72" stroke-width="2"/>
    <text x="428" y="240" text-anchor="middle" class="box-title">Tunnel sortant</text>
    <text x="428" y="270" text-anchor="middle" class="box-copy">Connexion initiée de l’intérieur</text>
    <text x="428" y="293" text-anchor="middle" class="box-copy">Aucune redirection publique</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="563" y="202" width="206" height="116" rx="18" fill="#f0e1cb" stroke="#9f4a25" stroke-width="2"/>
    <text x="666" y="240" text-anchor="middle" class="box-title">Entrée Web</text>
    <text x="666" y="270" text-anchor="middle" class="box-copy">Termine et filtre les requêtes</text>
    <text x="666" y="293" text-anchor="middle" class="box-copy">avant l’application</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="444" y="365" width="206" height="116" rx="18" fill="#e6c486" stroke="#76501e" stroke-width="2"/>
    <text x="547" y="404" text-anchor="middle" class="box-title">Application</text>
    <text x="547" y="434" text-anchor="middle" class="box-copy">Authentification, permissions</text>
    <text x="547" y="457" text-anchor="middle" class="box-copy">validation et journalisation</text>
  </g>

  <path d="M225 421 H274 Q292 421 306 402 L344 318" class="flow"/>
  <text x="245" y="397" class="flow-label">Tunnel chiffré</text>
  <path d="M531 260 H563" class="flow"/>
  <path d="M666 318 V343 Q666 365 644 386" class="flow"/>

  <rect x="842" y="130" width="240" height="390" rx="22" fill="#dfe5cf" opacity="0.97" stroke="#58684b" stroke-width="2"/>
  <text x="864" y="160" class="zone-title">ZONE DE DONNÉES PRIVÉE</text>

  <g filter="url(#shadow)">
    <ellipse cx="962" cy="247" rx="79" ry="25" fill="#c6d2ad" stroke="#58684b" stroke-width="2"/>
    <path d="M883 247 V360 C883 374 918 385 962 385 C1006 385 1041 374 1041 360 V247" fill="#c6d2ad" stroke="#58684b" stroke-width="2"/>
    <ellipse cx="962" cy="360" rx="79" ry="25" fill="#b5c49a" stroke="#58684b" stroke-width="2"/>
    <text x="962" y="304" text-anchor="middle" class="box-title">Données</text>
    <text x="962" y="331" text-anchor="middle" class="box-copy">Non exposées à Internet</text>
  </g>

  <rect x="849" y="430" width="226" height="58" rx="29" fill="#f0e1cb" stroke="#58684b" stroke-width="2"/>
  <text x="962" y="454" text-anchor="middle" class="pill">POLITIQUE RÉSEAU MINIMALE</text>
  <text x="962" y="474" text-anchor="middle" class="box-copy">seul le flux nécessaire est permis</text>

  <path d="M650 423 H820 Q842 423 860 400 L885 368" class="flow"/>
  <text x="682" y="407" class="flow-label">Accès contrôlé</text>

  <rect x="38" y="552" width="1044" height="62" rx="16" fill="#4e3038" stroke="#c48a32" stroke-width="1"/>
  <text x="560" y="578" text-anchor="middle" class="subtitle">Principe : une seule entrée publique surveillée, puis des frontières successives.</text>
  <text x="560" y="600" text-anchor="middle" class="subtitle">La base de données et les interfaces d’administration ne sont jamais offertes directement au navigateur.</text>
</svg>
